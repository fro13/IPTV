name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and repair launcher PNG
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          icon = Path("app/src/main/res/drawable-nodpi/iptv_icon.png")
          try:
              with Image.open(icon) as im:
                  im.load()
          except Exception as exc:
              print("Replacing invalid launcher image:", exc)
              ImageFile.LOAD_TRUNCATED_IMAGES = True
              with Image.open(icon) as im:
                  repaired = im.convert("RGBA")
              repaired.save(icon, format="PNG", optimize=True)
          ImageFile.LOAD_TRUNCATED_IMAGES = False
          with Image.open(icon) as im:
              im.verify()
          with Image.open(icon) as im:
              im.load()
              print("Valid launcher icon:", im.size, im.mode)
          PY
      - name: Persist repaired icon in repository
        run: |
          if ! git diff --quiet -- app/src/main/res/drawable-nodpi/iptv_icon.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res/drawable-nodpi/iptv_icon.png
            git commit -m "Repair corrupted launcher PNG"
            git push origin HEAD:main
          fi
      - name: Bundle channel logos for offline display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from io import BytesIO
          from urllib.request import urlopen,Request
          import time
          sources=["https://i.imgur.com/1IqCGe9.png","https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Russia-1.svg/960px-Russia-1.svg.png","https://i.imgur.com/kFdooR4.png","https://i.imgur.com/DtQX5P2.png","https://i.imgur.com/u8Q69D9.png","https://i.imgur.com/S12gaLc.png","https://i.imgur.com/tpqsFzm.png","https://i.imgur.com/4fFMlVq.png","https://i.imgur.com/QyZvT3e.png","https://i.imgur.com/ZP0D6Rd.png","https://i.imgur.com/18TAzYV.png","https://i.imgur.com/A6Cqsom.jpeg","https://i.imgur.com/y9bpqUD.png","https://i.imgur.com/e8wlMIt.png","https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/%D0%A2V3_logo_2023.svg/500px-%D0%A2V3_logo_2023.svg.png","https://i.imgur.com/rS11zVB.png","https://i.imgur.com/c0L0ncA.png","https://i.imgur.com/L2slsbG.png","https://i.imgur.com/1WqIPOB.png","https://i.imgur.com/Ml3qqOF.png","https://iptvx.one/picons/bst.png","https://iptvx.one/picons/bashkortostan24.png"]
          fallbacks=["https://iptvx.one/picons/pervy.png","https://iptvx.one/picons/rossia1.png","https://iptvx.one/picons/matchtv.png","https://iptvx.one/picons/ntv.png","https://iptvx.one/picons/5kanal-ru.png","https://iptvx.one/picons/kultura.png","https://iptvx.one/picons/rossia24.png","https://iptvx.one/picons/karusel.png","https://iptvx.one/picons/otr.png","https://iptvx.one/picons/tvcentr.png","https://iptvx.one/picons/rentv.png","https://iptvx.one/picons/spas.png","https://iptvx.one/picons/sts.png","https://iptvx.one/picons/domashniy.png","https://iptvx.one/picons/tv3-ru.png","https://iptvx.one/picons/piatnica.png","https://iptvx.one/picons/zvezda.png","https://iptvx.one/picons/mir.png","https://iptvx.one/picons/tnt.png","https://iptvx.one/picons/muz-tv.png","https://iptvx.one/picons/bst.png","https://iptvx.one/picons/bashkortostan24.png"]
          names=["1","Россия 1","МАТЧ!","НТВ","5","Россия К","Россия 24","Карусель","ОТР","ТВЦ","РЕН","СПАС","СТС","Домашний","ТВ-3","Пятница!","Звезда","Мир","ТНТ","МУЗ","БСТ","Башкортостан 24"]
          out=Path("app/src/main/assets/channel_logos")
          out.mkdir(parents=True,exist_ok=True)
          missing=[]
          for idx,(first,second) in enumerate(zip(sources,fallbacks),1):
            success=False
            for url in dict.fromkeys([first,second]):
              try:
                req=Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; AndroidIPTVLogoBuilder/1.0)"})
                with urlopen(req,timeout=15) as resp: data=resp.read(3000000)
                img=Image.open(BytesIO(data))
                img.load()
                img=img.convert("RGBA")
                img.thumbnail((288,165), Image.Resampling.LANCZOS)
                canvas=Image.new("RGBA",(300,180),(0,0,0,0))
                canvas.alpha_composite(img,((300-img.width)//2,(180-img.height)//2))
                canvas.save(out/("%02d.png"%idx),optimize=True)
                print("%02d OK %s %s"%(idx,url,img.size))
                success=True
                break
              except Exception as exc: print("%02d unavailable %s %s"%(idx,url,exc))
            if not success:
              missing.append(idx)
              # Keep every tile usable even if third-party logo CDNs are down.
              img=Image.new("RGBA",(300,180),(0,0,0,0))
              d=ImageDraw.Draw(img);d.text((12,78),names[idx-1],fill=(234,243,255,255))
              img.save(out/("%02d.png"%idx))
          if missing: print("Logo source unavailable, temporary labeled fallback:",missing)
          
          PY
      - name: Improve OTR and MUZ TV grid logos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          W,H=300,180
          out=Path("app/src/main/assets/channel_logos")
          font="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          img=Image.new("RGBA",(W,H),(0,0,0,0))
          d=ImageDraw.Draw(img)
          for dx,dy,c in [(-14,0,(34,205,255,220)),(0,-8,(255,52,184,215)),(14,8,(114,70,255,215))]:
              d.ellipse((78-44+dx,90-44+dy,78+44+dx,90+44+dy),outline=c,width=16)
          d.text((132,48),"ОТР",font=ImageFont.truetype(font,72),fill=(245,248,252,255))
          img.save(out/"09.png")
          img=Image.new("RGBA",(W,H),(0,0,0,0))
          d=ImageDraw.Draw(img)
          for shape,c in [
              ([(120,34),(150,62),(120,90),(90,62)],(255,67,170,255)),
              ([(152,34),(182,62),(152,90),(122,62)],(180,39,255,255)),
              ([(120,92),(150,120),(120,148),(90,120)],(255,81,196,255)),
              ([(152,92),(182,120),(152,148),(122,120)],(124,59,255,255))
          ]: d.polygon(shape,fill=c)
          f=ImageFont.truetype(font,58)
          bbox=d.textbbox((0,0),"МУЗ",font=f)
          width=bbox[2]-bbox[0]
          d.text(((W-width)//2,118),"МУЗ",font=f,fill=(245,248,252,255))
          img.save(out/"20.png")
          print("Improved OTR and MUZ TV channel logos embedded")
          PY
      - name: Make MIR channel logo readable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          path=Path("app/src/main/assets/channel_logos/18.png")
          img=Image.open(path).convert("RGBA")
          # Preserve the original multicolour ring. Its black wordmark is
          # invisible against the app's dark background, so use white lettering.
          text=ImageDraw.Draw(img)
          font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",27)
          text.text((img.width//2,img.height//2),"МИР",font=font,anchor="mm",fill=(255,255,255,255))
          img.save(path,optimize=True)
          print("White MIR wordmark embedded")
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify installable APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Name APK MTS_IPTV.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MTS_IPTV.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTS_IPTV
          path: app/build/outputs/apk/debug/MTS_IPTV.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="app/build/outputs/apk/debug/MTS_IPTV.apk"
          tag="stable"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --notes-file CHANGELOG.md --latest
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "МТС IPTV" \
              --notes-file CHANGELOG.md \
              --latest
          fi
