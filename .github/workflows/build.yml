name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and repair launcher PNG
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          icon = Path("app/src/main/res/drawable-nodpi/iptv_icon.png")
          try:
              with Image.open(icon) as im:
                  im.load()
          except Exception as exc:
              print("Replacing invalid launcher image:", exc)
              ImageFile.LOAD_TRUNCATED_IMAGES = True
              with Image.open(icon) as im:
                  repaired = im.convert("RGBA")
              repaired.save(icon, format="PNG", optimize=True)
          ImageFile.LOAD_TRUNCATED_IMAGES = False
          with Image.open(icon) as im:
              im.verify()
          with Image.open(icon) as im:
              im.load()
              print("Valid launcher icon:", im.size, im.mode)
          PY
      - name: Persist repaired icon in repository
        run: |
          if ! git diff --quiet -- app/src/main/res/drawable-nodpi/iptv_icon.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res/drawable-nodpi/iptv_icon.png
            git commit -m "Repair corrupted launcher PNG"
            git push origin HEAD:main
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify per-architecture APKs
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          test -s app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          test -s app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Upload TV APK (ARM 32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-TV-armeabi-v7a-APK
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
      - name: Upload phone APK (ARM 64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Phone-arm64-v8a-APK
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
