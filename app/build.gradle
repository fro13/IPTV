plugins { id 'com.android.application' }
android {
    namespace 'ru.iptv.app'
    compileSdk 35
    defaultConfig { applicationId 'ru.iptv.app'; minSdk 23; targetSdk 34; versionCode 5; versionName '1.4' }
    // Smaller, architecture-specific APKs: avoid bundling x86 and both ARM libraries together.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'org.videolan.android:libvlc-all:3.6.5' }
